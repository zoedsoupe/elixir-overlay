name: Update BEAM Manifests

on:
  schedule:
    - cron: "0 6 * * 0" # Weekly on Sundays at 6 AM UTC
  workflow_dispatch:

jobs:
  update-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.5
          otp-version: 29

      - name: Update manifests
        run: elixir scripts/update_manifests.exs

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- manifests/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.TOKEN }}
          commit-message: "update: beam manifests"
          title: "Update BEAM manifests"
          body: |
            ## Summary
            - Automatically updated Elixir, Erlang/OTP, and Mix archive manifests

            ## Test plan
            - [ ] Verify new versions build correctly
            - [ ] Check OTP compatibility ranges are accurate
            - [ ] Check new Erlang/OTP release aliases
            - [ ] Check Phoenix and Igniter archive versions
          branch: update-beam-manifests
          delete-branch: true
