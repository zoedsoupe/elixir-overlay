name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - uses: cachix/cachix-action@v15
        with:
          name: elixir-overlay
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name != 'push' }}

      - name: Check flake
        run: nix flake check --accept-flake-config

      - name: Build latest Elixir
        run: nix build --accept-flake-config .#default

      - name: Evaluate overlay tests
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs {
                system = "x86_64-linux";
                overlays = [ (import ./.) ];
              };
              allTrue = checks: builtins.all (value: value == true) (builtins.attrValues checks);
              options = import ./tests/options.nix { inherit (pkgs) lib; };
              manifests = import ./tests/manifests.nix { inherit (pkgs) lib; };
              toolchain = import ./tests/toolchain.nix { inherit pkgs; };
              mix = import ./tests/mix/evaluation.nix { inherit pkgs; };
              phoenix = import ./tests/phoenix/evaluation.nix { inherit pkgs; };
              exampleArgs = {
                inherit pkgs;
                pname = "example-app";
                version = "0.1.0";
                src = ./tests/phoenix/fixture;
                mixDepsHash = pkgs.lib.fakeHash;
              };
              mixExample = import ./examples/mix-release.nix exampleArgs;
              phoenixExample = import ./examples/phoenix-release.nix exampleArgs;
            in
              assert options;
              assert manifests.count >= 53;
              assert allTrue toolchain;
              assert allTrue mix;
              assert allTrue phoenix;
              assert builtins.isString mixExample.drvPath;
              assert builtins.isString phoenixExample.drvPath;
              "overlay evaluation checks passed"
          '

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir-version: ["latest", "1.19.7", "1.18.6"]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - uses: cachix/cachix-action@v15
        with:
          name: elixir-overlay
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name != 'push' }}

      - name: Build Elixir ${{ matrix.elixir-version }}
        run: |
          nix build --accept-flake-config --impure --expr 'let flake = builtins.getFlake (toString ./.) ; pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; overlays = [ (import ./.) ]; }; in pkgs.beam-overlay.elixir."${{ matrix.elixir-version }}"'

  macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - uses: cachix/cachix-action@v15
        with:
          name: elixir-overlay
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name != 'push' }}

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = arm64

      - name: Build Elixir packages
        run: nix build --accept-flake-config .#default .#elixir_1_19_7 .#elixir_1_18_6

      - name: Check OTP compatibility
        run: nix flake check --accept-flake-config
